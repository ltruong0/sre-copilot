# mcp_meta:
#   name: ping_host
#   description: Check if host is reachable via ICMP, port scan, and SSH
#   destructive: false
#   keywords: [ping, reachable, connectivity, network, ssh]
#   vars:
#     target_hosts: {type: string, required: true, description: "Host or group to check"}
---
- name: Ping Host Playbook
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Display ping information
      debug:
        msg: |
          ====================================
          HOST REACHABILITY CHECK
          ====================================
          Target: {{ target_hosts }}
          ====================================

    - name: ICMP ping the host
      command: ping -c 3 -W 2 {{ target_hosts }}
      register: icmp_result
      ignore_errors: true
      changed_when: false

    - name: Display ICMP ping result
      debug:
        msg: "{{ '✓' if icmp_result.rc == 0 else '✗' }} ICMP Ping: {{ 'Reachable' if icmp_result.rc == 0 else 'Unreachable' }}"

    - name: Scan common ports with nmap
      command: nmap -Pn --top-ports 20 -T4 {{ target_hosts }}
      register: nmap_result
      ignore_errors: true
      changed_when: false

    - name: Display port scan results
      debug:
        msg: |
          ====================================
          PORT SCAN RESULTS (Top 20 Ports)
          ====================================
          {{ nmap_result.stdout | default('nmap not available or scan failed') }}
          ====================================
      when: nmap_result.rc == 0

    - name: Display port scan error
      debug:
        msg: "✗ Port scan failed: {{ nmap_result.stderr | default('nmap may not be installed') }}"
      when: nmap_result.rc != 0

    - name: Test SSH connectivity (Ansible ping)
      ansible.builtin.ping:
      delegate_to: "{{ target_hosts }}"
      register: ssh_result
      ignore_errors: true

    - name: Display SSH connectivity result
      debug:
        msg: "{{ '✓' if ssh_result.ping is defined else '✗' }} SSH Connectivity: {{ 'Success' if ssh_result.ping is defined else 'Failed - ' + (ssh_result.msg | default('Unable to connect')) }}"
